spring.application.name=trigger-service
server.port=8084
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triggerdb}
spring.datasource.username=${DB_USER:trigger}
spring.datasource.password=${DB_PASS:trigger}
spring.jpa.hibernate.ddl-auto=update
execution.service.base-url=${EXECUTION_URL:http://localhost:8082}
trigger.cron.expression=*/30 * * * * *
# Must exist in workflow-service and be PUBLISHED, or execution-service returns 404/400.
trigger.cron.workflow-id=${TRIGGER_CRON_WORKFLOW_ID:1}
# When non-empty, POST /api/triggers/webhook requires header X-Webhook-Secret with this exact value.
trigger.webhook.secret=${WEBHOOK_SECRET:}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.configs.default.slidingWindowSize=20
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.executionApi.baseConfig=default
