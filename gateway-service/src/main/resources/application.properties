spring.application.name=gateway-service
server.port=8080
spring.cloud.gateway.routes[0].id=frontend
spring.cloud.gateway.routes[0].uri=lb://FRONTEND-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/,/index.html,/js/**,/assets/**,/favicon.ico,/ui-api/**
spring.cloud.gateway.routes[1].id=workflow
spring.cloud.gateway.routes[1].uri=lb://WORKFLOW-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/workflows/**
spring.cloud.gateway.routes[2].id=execution
spring.cloud.gateway.routes[2].uri=lb://EXECUTION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/executions/**
spring.cloud.gateway.routes[3].id=monitoring
spring.cloud.gateway.routes[3].uri=lb://MONITORING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/monitoring/**
spring.cloud.gateway.routes[4].id=trigger
spring.cloud.gateway.routes[4].uri=lb://TRIGGER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/triggers/**
spring.cloud.gateway.routes[5].id=notify
spring.cloud.gateway.routes[5].uri=lb://NOTIFY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notify/**
spring.cloud.gateway.routes[6].id=bff
spring.cloud.gateway.routes[6].uri=lb://BFF-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/bff/**
spring.cloud.gateway.routes[7].id=dlq
spring.cloud.gateway.routes[7].uri=lb://DLQ-PROCESSOR-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/dlq/**
management.endpoints.web.exposure.include=health,info,prometheus

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
