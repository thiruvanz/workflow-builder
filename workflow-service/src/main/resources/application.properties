spring.application.name=workflow-service
server.port=8081
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workflowdb}
spring.datasource.username=${DB_USER:workflow}
spring.datasource.password=${DB_PASS:workflow}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:6}
app.kafka.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
