spring.application.name=execution-service
server.port=8082
# Surfaces ResponseStatusException reasons (e.g. "Workflow not found") instead of a generic Not Found body.
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/executiondb}
spring.datasource.username=${DB_USER:execution}
spring.datasource.password=${DB_PASS:execution}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
workflow.service.base-url=${WORKFLOW_URL:http://localhost:8081}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:6}
app.kafka.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.properties.isolation.level=read_committed
temporal.target=${TEMPORAL_TARGET:localhost:7233}

# Used as From when sending workflow emails (Mailpit / real SMTP). Set SPRING_MAIL_FROM in Docker to override.
spring.mail.from=${SPRING_MAIL_FROM:noreply@localhost}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Resilience4j circuit breakers (names shared across services for outbound calls)
resilience4j.circuitbreaker.configs.default.slidingWindowSize=20
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.workflowApi.baseConfig=default
resilience4j.circuitbreaker.instances.httpActivity.baseConfig=default
