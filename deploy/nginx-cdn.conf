proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=asset_cache:32m max_size=512m inactive=24h use_temp_path=off;
proxy_cache_path /var/cache/nginx-api levels=1:2 keys_zone=api_cache:16m max_size=256m inactive=2m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Cache static frontend assets aggressively
    location ~* ^/(js|css|images|assets)/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache asset_cache;
        proxy_cache_valid 200 301 302 24h;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 24h;
    }

    # Micro-cache dashboard/API GET responses
    location ~* ^/api/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Default pass-through for UI and non-cached paths
    location / {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
