global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: monitoring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monitoring-service:8083"]

  - job_name: notify
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notify-service:8085"]
