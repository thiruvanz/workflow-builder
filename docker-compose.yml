services:
  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile.discovery-service
    ports:
      - "8761:8761"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Dev SMTP: workflow email nodes deliver here. Web UI http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"
      - "8025:8025"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092"
    ports:
      - "9092:9092"

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
       - DB=postgres12
       - DB_PORT=5432
       - POSTGRES_USER=postgres
       - POSTGRES_PWD=postgres
       - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "16686:16686"

  workflow-service:
    build:
      context: .
      dockerfile: Dockerfile.workflow-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workflowdb
      DB_USER: workflow
      DB_PASS: workflow
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: redpanda:9092
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - postgres
      - redis
      - redpanda

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.execution-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/executiondb
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: redpanda:9092
      WORKFLOW_URL: http://workflow-service:8081
      TEMPORAL_TARGET: temporal:7233
      EUREKA_URI: http://discovery-service:8761/eureka
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_FROM: workflow@local.test
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - postgres
      - redis
      - redpanda
      - temporal
      - workflow-service
      - mailpit

  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring-service
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      WORKFLOW_URL: http://workflow-service:8081
      EXECUTION_URL: http://execution-service:8082
      MONGO_URI: mongodb://mongo:27017/workflow_monitoring
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - redpanda
      - workflow-service
      - execution-service
      - mongo

  trigger-service:
    build:
      context: .
      dockerfile: Dockerfile.trigger-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/triggerdb
      DB_USER: trigger
      DB_PASS: trigger
      EXECUTION_URL: http://execution-service:8082
      TRIGGER_CRON_WORKFLOW_ID: ${TRIGGER_CRON_WORKFLOW_ID:-1}
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - postgres
      - execution-service

  notify-service:
    build:
      context: .
      dockerfile: Dockerfile.notify-service
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      ELASTIC_URL: http://elasticsearch:9200
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - redpanda
      - elasticsearch

  bff-service:
    build:
      context: .
      dockerfile: Dockerfile.bff-service
    environment:
      WORKFLOW_URL: http://workflow-service:8081
      MONITORING_URL: http://monitoring-service:8083
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - workflow-service
      - monitoring-service

  dlq-processor-service:
    build:
      context: .
      dockerfile: Dockerfile.dlq-processor-service
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - redpanda

  frontend-service:
    build:
      context: .
      dockerfile: Dockerfile.frontend-service
    ports:
      - "8088:8088"
    environment:
      WORKFLOW_URL: http://workflow-service:8081
      EXECUTION_URL: http://execution-service:8082
      MONITORING_URL: http://monitoring-service:8083
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - workflow-service
      - execution-service
      - monitoring-service

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.gateway-service
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - frontend-service
      - workflow-service
      - execution-service
      - monitoring-service
      - trigger-service
      - notify-service
      - bff-service
      - dlq-processor-service

  cdn-service:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-cdn.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway-service
      - monitoring-service
      - notify-service

  grafana:
    image: grafana/grafana:11.2.2
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
