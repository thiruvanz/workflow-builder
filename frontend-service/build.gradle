plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencies {
    implementation project(':resilience-platform')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
    }
}

def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"

tasks.register('npmInstall', Exec) {
    workingDir = file('react-app')
    commandLine npmCommand, 'install'
}

tasks.register('buildReactApp', Exec) {
    dependsOn tasks.named('npmInstall')
    workingDir = file('react-app')
    commandLine npmCommand, 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.named('buildReactApp')
}
